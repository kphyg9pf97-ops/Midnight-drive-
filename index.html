<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Midnight Drive</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#05070c;color:#eef2f7;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{min-height:100vh;display:grid;place-items:center;padding:20px;overflow:hidden}
.app{width:min(920px,100%);border:1px solid #202735;border-radius:28px;background:linear-gradient(145deg,#111722,#070a10 70%);box-shadow:0 30px 80px #0008;overflow:hidden}
.hero{min-height:610px;position:relative;padding:42px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1.5px);background-size:120px 100px;opacity:.28}
.moon{position:absolute;width:180px;height:180px;border-radius:50%;right:8%;top:8%;background:#dfe7f1;box-shadow:0 0 70px #b9d3ff33}
.city{position:absolute;left:0;right:0;bottom:0;height:190px;background:linear-gradient(90deg,#080b12 0 8%,transparent 8% 11%,#0b1019 11% 19%,transparent 19% 22%,#080b12 22% 35%,transparent 35% 39%,#0b1019 39% 48%,transparent 48% 52%,#080b12 52% 63%,transparent 63% 66%,#0b1019 66% 76%,transparent 76% 81%,#080b12 81% 100%);clip-path:polygon(0 55%,7% 45%,11% 56%,18% 25%,25% 52%,33% 38%,42% 55%,49% 22%,57% 52%,65% 34%,73% 52%,82% 18%,90% 48%,100% 30%,100% 100%,0 100%)}
.road{position:absolute;left:-15%;right:-15%;bottom:-120px;height:300px;background:linear-gradient(90deg,transparent 48%,#e6eaf0aa 49% 51%,transparent 52%);transform:perspective(350px) rotateX(62deg)}
.content{position:relative;z-index:3}.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#9ba7b8}.title{font-size:clamp(58px,11vw,110px);font-weight:900;line-height:.82;letter-spacing:-.07em;margin:16px 0}.sub{max-width:570px;color:#aeb8c7;line-height:1.65;font-size:17px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
button{font:inherit}.btn{border:1px solid #30394a;background:#ffffff0b;color:#fff;border-radius:999px;padding:13px 20px;cursor:pointer;min-height:46px}.btn.primary{background:#eef2f7;color:#090c12;border-color:#eef2f7;font-weight:750}.btn:hover{filter:brightness(1.08)}
.car{position:absolute;z-index:4;bottom:55px;left:50%;transform:translateX(-50%);font-size:70px;filter:drop-shadow(0 15px 20px #000)}
.panel{border-top:1px solid #202735;padding:28px;background:#0a0e15}.panel h2{margin:0 0 5px;font-size:23px}.muted{color:#8f9bad;font-size:14px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.choice{text-align:left;border:1px solid #252e3d;border-radius:18px;background:#101620;color:#fff;padding:18px;min-height:130px;cursor:pointer}.choice strong{display:block;font-size:18px;margin-bottom:7px}.choice span{color:#8f9bad;font-size:13px}.choice.selected{outline:2px solid #dbe6f6}
.result{display:none;margin-top:16px;border:1px solid #273142;background:#0f151e;border-radius:18px;padding:20px}.result.show{display:block}.route{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.stop{padding:8px 11px;border-radius:10px;background:#ffffff09}.arrow{color:#697586;padding:8px 0}.quote{font-size:24px;font-weight:750;line-height:1.3}.tiny{font-size:11px;color:#7e8999;margin-top:10px}
footer{padding:18px 28px;border-top:1px solid #202735;color:#657184;font-size:11px;text-align:center;letter-spacing:.08em}
@media(max-width:650px){.hero{min-height:560px;padding:27px}.choices{grid-template-columns:1fr}.choice{min-height:90px}.moon{width:110px;height:110px}.car{font-size:58px}}
</style>
</head>
<body>
<main>
<div class="app">
<section class="hero">
<div class="stars"></div><div class="moon"></div><div class="city"></div><div class="road"></div>
<div class="content">
<div class="eyebrow">23:47 · somewhere in the Netherlands</div>
<div class="title">MIDNIGHT<br>DRIVE.</div>
<div class="sub">No schedule. No destination. Just the road, the lights and whatever happens after you leave.</div>
<div class="actions"><button class="btn primary" id="start">Start the drive</button><button class="btn" id="random">Surprise me</button></div>
</div>
<div class="car">🚗</div>
</section>
<section class="panel" id="planner" hidden>
<h2>Choose the vibe.</h2><div class="muted">There isn't a wrong answer.</div>
<div class="choices">
<button class="choice" data-place="City Lights" data-route="Drive · Late food · City lights" data-text="Some nights are not meant to be planned."><strong>🌃 City Lights</strong><span>Late food & bright streets</span></button>
<button class="choice" data-place="The Coast" data-route="Drive · Music · Quiet water" data-text="Sometimes you just need somewhere quiet."><strong>🌊 The Coast</strong><span>Music & a little escape</span></button>
<button class="choice" data-place="Unknown" data-route="Drive · No map · See where it goes" data-text="The best stories usually start without a plan."><strong>🌙 Unknown</strong><span>No map. Just drive.</span></button>
</div>
<div class="result" id="result"><div class="eyebrow" id="place">TONIGHT</div><div class="route" id="route"></div><div class="quote" id="quote"></div><div class="tiny">Destination generated for this drive.</div></div>
</section>
<footer>KEEP DRIVING · SOMEWHERE AFTER MIDNIGHT</footer>
</div>
</main>
<script>
const planner=document.querySelector('#planner'),result=document.querySelector('#result'),place=document.querySelector('#place'),route=document.querySelector('#route'),quote=document.querySelector('#quote'),choices=[...document.querySelectorAll('.choice')];
function show(c){choices.forEach(x=>x.classList.remove('selected'));c.classList.add('selected');place.textContent=c.dataset.place.toUpperCase();route.innerHTML=c.dataset.route.split(' · ').map((x,i)=>`<span class="stop">${x}</span>${i<2?'<span class="arrow">→</span>':''}`).join('');quote.textContent='“'+c.dataset.text+'”';result.classList.add('show');}
document.querySelector('#start').onclick=()=>{planner.hidden=false;planner.scrollIntoView({behavior:'smooth'});}
document.querySelector('#random').onclick=()=>{planner.hidden=false;show(choices[Math.floor(Math.random()*choices.length)]);planner.scrollIntoView({behavior:'smooth'});}
choices.forEach(c=>c.onclick=()=>show(c));
</script>
</body>
</html>
